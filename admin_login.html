<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Sportify</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background:
                linear-gradient(rgba(3, 15, 30, 0.88),
                rgba(3, 15, 30, 0.94)),
                url("https://images.unsplash.com/photo-1461896836934-ffe607ba8211?auto=format&fit=crop&w=2000&q=80");

            background-size: cover;
            background-position: center;

            color: white;
        }

        .page {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-box {
            width: 420px;
            max-width: 100%;

            padding: 45px 40px;

            background: rgba(255,255,255,0.10);

            border: 1px solid rgba(255,255,255,0.20);

            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow: 0 20px 50px rgba(0,0,0,0.35);

            text-align: center;
        }

        .icon {
            width: 80px;
            height: 80px;

            margin: 0 auto 20px;

            background: #f5c542;

            color: #07111f;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 40px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        h1 span {
            color: #f5c542;
        }

        .subtitle {
            color: #b8c6d6;
            margin-bottom: 30px;
        }

        .error {
            background: rgba(255, 70, 70, 0.15);
            border: 1px solid rgba(255, 70, 70, 0.4);
            color: #ffb3b3;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 8px;

            background: rgba(255,255,255,0.08);

            color: white;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #f5c542;
        }

        input::placeholder {
            color: #9caabd;
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #f5c542;

            color: #07111f;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background: white;
            transform: translateY(-3px);
        }

        .back {
            display: inline-block;

            margin-top: 25px;

            color: #cbd5e1;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #f5c542;
        }

    </style>

</head>


<body>

    <div class="page">

        <div class="login-box">

            <div class="icon">
                👨‍💼
            </div>

            <h1>
                Admin <span>Login</span>
            </h1>

            <p class="subtitle">
                Login to manage the tournament
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}


            <!-- ADMIN LOGIN FORM -->

            <form method="POST" action="/admin-login">

                <div class="input-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter admin username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button type="submit" class="login-btn">
                    LOGIN →
                </button>

            </form>


            <a href="/login" class="back">
                ← Back to Account Selection
            </a>

        </div>

    </div>

</body>

</html>
